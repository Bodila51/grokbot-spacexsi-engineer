name: Regenerate version.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate the manifest when synced files changed
        run: python3 scripts/build-version.py

      - name: Commit the manifest if it changed
        run: |
          if git diff --quiet -- version.json; then
            echo "version.json already matches the synced files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: regenerate version.json"
          git push origin HEAD:main
